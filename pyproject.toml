[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "voodoo-si"
version = "0.2.0"
description = "A local synthetic-intelligence companion for authorized security work"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["httpx>=0.28,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[project.scripts]
voodoo = "voodoo.cli:main"
voodoo-desktop = "voodoo.desktop:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
